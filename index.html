<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dein Wichtel</title>
<style>
  :root {
    --bg: #fbf7f2;
    --card: #ffffff;
    --text: #2b2420;
    --muted: #7a6e66;
    --accent: #b3261e;
    --accent-soft: #f6e3e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1715;
      --card: #26201d;
      --text: #f3ece6;
      --muted: #a89c93;
      --accent: #ff8a80;
      --accent-soft: #3a2422;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgb(0 0 0 / 0.08);
  }
  .emoji { font-size: 56px; line-height: 1; }
  h1 { font-size: 18px; font-weight: 500; color: var(--muted); margin: 20px 0 8px; }
  .name { font-size: 40px; font-weight: 700; color: var(--accent); margin: 0 0 24px; word-break: break-word; }
  .details { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip { background: var(--accent-soft); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  button {
    margin-top: 8px;
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 12px;
    padding: 14px 28px;
    cursor: pointer;
  }
  p.hint { color: var(--muted); font-size: 14px; margin: 24px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="closed">
    <div class="emoji">🎁</div>
    <h1>Dein Wichtel-Los ist da</h1>
    <p class="hint" style="margin: 0 0 24px">Schau, dass niemand mitliest.</p>
    <button id="open">Los öffnen</button>
  </section>
  <section id="revealed" hidden>
    <div class="emoji">🎄</div>
    <h1>Du beschenkst</h1>
    <p class="name" id="name"></p>
    <div class="details">
      <span class="chip" id="budget"></span>
      <span class="chip" id="date"></span>
    </div>
    <p class="hint">Psst – nicht verraten! 🤫</p>
  </section>
  <section id="invalid" hidden>
    <div class="emoji">🤷</div>
    <h1>Dieser Link ist ungültig</h1>
    <p class="hint">Öffne den Link genau so, wie er in deiner Nachricht steht.</p>
  </section>
</main>
<script>
  function fromBase64Url(text) {
    const base64 = text.replace(/-/g, "+").replace(/_/g, "/");
    return Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  }

  function decodeSecret(token) {
    const [key, cipher] = token.split(".").map(fromBase64Url);
    const plain = cipher.map((byte, i) => byte ^ key[i]);
    const end = plain.indexOf(0);
    const json = new TextDecoder().decode(end === -1 ? plain : plain.slice(0, end));
    return JSON.parse(json);
  }

  function show(id) {
    for (const section of document.querySelectorAll("main > section")) {
      section.hidden = section.id !== id;
    }
  }

  let secret;
  try {
    secret = decodeSecret(location.hash.slice(1));
  } catch {
    show("invalid");
  }

  document.getElementById("open").addEventListener("click", () => {
    document.getElementById("name").textContent = secret.n;
    document.getElementById("budget").textContent = `💶 ${secret.b}`;
    document.getElementById("date").textContent = `📅 ${secret.d}`;
    show("revealed");
  });
</script>
</body>
</html>
